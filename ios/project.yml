name: NMail
options:
  bundleIdPrefix: com.timcvetko
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  Mail:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: 5Z5VDUY233
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NMailPhone:
    type: application
    platform: iOS
    scheme: {}
    sources: [NMailPhone]
    dependencies:
      - package: Mail
        product: MailCore
    info:
      path: NMailPhone/Info.plist
      properties:
        CFBundleDisplayName: AxiosM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The iOS OAuth client from Google Cloud; Auth derives the redirect scheme by reversing it.
        NMailGoogleClientID: $(GOOGLE_CLIENT_ID_PREFIX).apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes: [com.googleusercontent.apps.$(GOOGLE_CLIENT_ID_PREFIX)]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.timcvetko.nmail.refresh]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timcvetko.nmail
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Replace with the part of the iOS client ID before ".apps.googleusercontent.com" (see ios/README.md).
        GOOGLE_CLIENT_ID_PREFIX: 809807346628-uja8i1molttf5f7ng71pu7dfjtm5u3su
